
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie | ICCTMS</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="manager-page">

    <main class="manager-container">

        <header class="manager-header">
            <div class="manager-brand">ICCTMS CINEMA TICKETING</div>

            <div class="manager-account">
                <span>{{ session.get("manager_name") }}</span>
                <span class="manager-role">MANAGER</span>
            </div>
        </header>

        <section class="manager-welcome">
            <p class="manager-label">MANAGEMENT PORTAL</p>
            <h1>Edit Movie</h1>
            <p>Update the information of an existing movie.</p>
        </section>

        <section class="manager-profile manager-form-section">

            <h2>Movie Information</h2>

            {% if error %}
                <div class="manager-form-error">{{ error }}</div>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('edit_movie', movie_id=movie.movie_id) }}"
                  class="manager-movie-form">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="manager-form-group">
                    <label for="title">Movie Title *</label>
                    <input type="text" id="title" name="title"
                           maxlength="200"
                           value="{{ movie.title }}" required>
                </div>

                <div class="manager-form-group">
                    <label for="genre">Genre *</label>
                    <input type="text" id="genre" name="genre"
                           maxlength="100"
                           value="{{ movie.genre }}" required>
                </div>

                <div class="manager-form-group">
                    <label for="duration">Duration (minutes) *</label>
                    <input type="number" id="duration" name="duration"
                           min="1" step="1"
                           value="{{ movie.duration }}" required>
                </div>

                <div class="manager-form-group">
                    <label for="release_date">Release Date</label>
                    <input type="date" id="release_date"
                           name="release_date"
                           value="{{ movie.release_date.isoformat() if movie.release_date else '' }}">
                </div>

                <div class="manager-form-group">
                    <label for="rating">Rating (out of 10)</label>
                    <input type="number" id="rating" name="rating"
                           min="0" max="10" step="0.1"
                           value="{{ movie.rating if movie.rating is not none else '' }}"
                           placeholder="e.g. 8.5">
                </div>

                <div class="manager-form-group">
                    <label for="description">Movie Description</label>
                    <textarea id="description" name="description"
                              rows="5"
                              placeholder="Enter a short movie description...">{{ movie.description or '' }}</textarea>
                </div>

                <div class="manager-form-actions">
                    <button type="submit" class="manager-add-button">
                        Save Changes
                    </button>

                    <a href="{{ url_for('manager_movies') }}"
                       class="manager-cancel-button">
                        Cancel
                    </a>
                </div>

            </form>

            <a href="{{ url_for('manager_movies') }}"
               class="manager-back-link">
                ← Back to Movies
            </a>

        </section>

        <footer class="manager-footer">
            ICCTMS | Manager Portal
        </footer>

    </main>

</body>
</html>
