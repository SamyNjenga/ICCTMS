
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ICCTMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="navbar">
    <div class="logo">ICCTMS</div>

    <nav class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('movies') }}">Movies</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('contact') }}">Contact</a>
    </nav>

    <div class="nav-actions">
        <a href="{{ url_for('login') }}" class="login-btn">Login</a>
    </div>
</header>

<main class="register-page">

    <section class="register-container">

        <div class="register-heading">
            <p class="section-label">JOIN ICCTMS</p>
            <h1>Create Your Account</h1>
            <p>Register to book movies, reserve seats and manage your cinema tickets.</p>
        </div>

        {% if error %}
            <div class="register-alert error">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('register') }}" method="POST" class="register-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       maxlength="100" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       maxlength="50" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       maxlength="100" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span>(Optional)</span></label>
                <input type="tel" id="phone" name="phone"
                       maxlength="20" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       minlength="8" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password"
                       name="confirm_password" minlength="8"
                       placeholder="Re-enter your password" required>
            </div>

            <button type="submit" class="primary-btn register-submit">
                Create Account
            </button>

        </form>

        <div class="register-login-link">
            <p>Already have an account?
                <a href="{{ url_for('login') }}">Login here</a>
            </p>
        </div>

    </section>

</main>

<footer class="footer">
    <p>&copy; 2026 Integrated Cloud-Based Cinema Ticketing Management System.</p>
</footer>

</body>
</html>
